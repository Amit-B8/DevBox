services:
  app:
    build:
      context: .
      target: frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
        NEXT_PUBLIC_USAGE_ENABLED: ${NEXT_PUBLIC_USAGE_ENABLED:-false}
        NEXT_PUBLIC_FEEDBACK_ENABLED: ${NEXT_PUBLIC_FEEDBACK_ENABLED:-false}
    ports:
      - "127.0.0.1:3000:8080"
    networks: [web]

  api:
    build:
      context: .
      target: backend
    environment:
      # Development override is ONLY for this loopback-bound local Compose setup.
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_LOCAL_WRITES: ${ENABLE_LOCAL_WRITES:-false}
      ENABLE_PUBLIC_WRITES: "false"
      ENABLE_USAGE: ${ENABLE_USAGE:-false}
      ENABLE_FEEDBACK: ${ENABLE_FEEDBACK:-false}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks: [web, database]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [database]

networks:
  web:
  database:
    internal: true
volumes:
  postgres_data:
